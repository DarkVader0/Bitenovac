name: Deploy web

on:
  workflow_dispatch:
    inputs:
      drop:
        description: Official drop to deploy, for example 2026.10.11.001. Empty for the newest.
        required: false
        default: ''

concurrency:
  group: deploy-web
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    name: Deploy
    runs-on: [self-hosted, linux, x64, bitenovac]
    timeout-minutes: 3
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Prepare
        id: prepare
        env:
          DROP: ${{ inputs.drop }}
        run: |
          set -euo pipefail
          args=(pages Bitenovac.DecompressionCalculator.Web "${RUNNER_TEMP}/site")
          [[ -z "${DROP}" ]] || args+=(--drop "${DROP}")
          bash deploy/remotedeploytool.sh "${args[@]}"

      - name: Upload
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/site
          include-hidden-files: true

      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Record
        if: success()
        env:
          DROP: ${{ steps.prepare.outputs.drop }}
        run: bash deploy/remotedeploytool.sh record github-pages Bitenovac.DecompressionCalculator.Web --drop "${DROP}"

      - name: Record the failure
        if: failure() && steps.prepare.outputs.drop != '' && steps.deployment.outcome != 'success'
        env:
          DROP: ${{ steps.prepare.outputs.drop }}
        run: bash deploy/remotedeploytool.sh record github-pages Bitenovac.DecompressionCalculator.Web --drop "${DROP}" --failed "the Pages deployment did not go through"
