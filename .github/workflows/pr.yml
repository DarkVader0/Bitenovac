name: PR

on:
  pull_request:
    branches: [master]
  merge_group:
    branches: [master]

concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"
  REMOTEBUILDTOOL_LOG_RUN: PR_${{ github.event.pull_request.number || 'queue' }}/${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  plan:
    name: Plan
    runs-on: [self-hosted, linux, x64, bitenovac]
    timeout-minutes: 1
    steps:
      - uses: actions/checkout@v7

      - run: bash runner/in-container.sh plan

  debug-build:
    name: Debug build
    needs: plan
    runs-on: [self-hosted, linux, x64, bitenovac]
    timeout-minutes: 1
    steps:
      - uses: actions/checkout@v7

      - name: Build
        run: bash runner/in-container.sh build Debug

  debug-test:
    name: Debug test
    needs: debug-build
    runs-on: [self-hosted, linux, x64, bitenovac]
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7

      - name: Test + coverage gate
        run: bash runner/in-container.sh test Debug

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-Debug
          path: artifacts/coverage-report/Debug
          if-no-files-found: ignore

  release-build:
    name: Release build
    needs: plan
    runs-on: [self-hosted, linux, x64, bitenovac]
    timeout-minutes: 1
    steps:
      - uses: actions/checkout@v7

      - name: Build
        run: bash runner/in-container.sh build Release

  release-test:
    name: Release test
    needs: release-build
    runs-on: [self-hosted, linux, x64, bitenovac]
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7

      - name: Test
        run: bash runner/in-container.sh test Release

  pr:
    name: PR
    needs: [debug-test, release-test]
    if: always()
    runs-on: [self-hosted, linux, x64, bitenovac]
    timeout-minutes: 1
    steps:
      - name: Check results
        run: |
          echo "plan:          ${{ needs.plan.result }}"
          echo "debug build:   ${{ needs.debug-build.result }}"
          echo "debug test:    ${{ needs.debug-test.result }}"
          echo "release build: ${{ needs.release-build.result }}"
          echo "release test:  ${{ needs.release-test.result }}"

          failed=0
          for result in "${{ needs.plan.result }}" "${{ needs.debug-build.result }}" "${{ needs.debug-test.result }}" "${{ needs.release-build.result }}" "${{ needs.release-test.result }}"; do
            case "${result}" in
              success) ;;
              *) failed=1 ;;
            esac
          done

          if [ "${failed}" -ne 0 ]; then
            echo "::error::At least one required job did not succeed."
            exit 1
          fi

          echo "All required jobs succeeded."
