name: PR

on:
  pull_request:
    branches: [master]

concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

env:
  DOTNET_NOLOGO: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"
  REMOTEBUILDTOOL_PR_VOLUME: bitenovac-pr-${{ github.run_id }}
  REMOTEBUILDTOOL_LOG_RUN: PR_${{ github.event.pull_request.number }}/${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  plan:
    name: Plan
    runs-on: [self-hosted, linux, x64, bitenovac]
    timeout-minutes: 1
    steps:
      - uses: actions/checkout@v7

      - run: bash runner/in-container.sh plan

  debug-build:
    name: Debug build
    needs: plan
    runs-on: [self-hosted, linux, x64, bitenovac]
    timeout-minutes: 1
    steps:
      - uses: actions/checkout@v7

      - name: Build
        run: bash runner/in-container.sh build Debug

  debug-test:
    name: Debug test
    needs: debug-build
    runs-on: [self-hosted, linux, x64, bitenovac]
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7

      - name: Test + coverage gate
        run: bash runner/in-container.sh test Debug

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-Debug
          path: artifacts/coverage-report/Debug
          if-no-files-found: ignore

  release-build:
    name: Release build
    needs: plan
    runs-on: [self-hosted, linux, x64, bitenovac]
    timeout-minutes: 1
    steps:
      - uses: actions/checkout@v7

      - name: Build
        run: bash runner/in-container.sh build Release

  release-test:
    name: Release test
    needs: release-build
    runs-on: [self-hosted, linux, x64, bitenovac]
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7

      - name: Test
        run: bash runner/in-container.sh test Release

  cleanup:
    name: Cleanup
    needs: [plan, debug-build, debug-test, release-build, release-test]
    if: always()
    runs-on: [self-hosted, linux, x64, bitenovac]
    timeout-minutes: 1
    steps:
      - uses: actions/checkout@v7

      - name: Fetch job timings
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifacts
          curl -fsS -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}/jobs?per_page=100" \
            -o artifacts/jobs.json || echo "Job timings unavailable; the build is reported without them."

      - name: Report build
        continue-on-error: true
        run: bash runner/in-container.sh report-build "${{ (contains(needs.*.result, 'failure') && 'failure') || (contains(needs.*.result, 'cancelled') && 'cancelled') || 'success' }}" artifacts/jobs.json

      - name: Drop this run's volumes
        run: docker volume rm -f "${REMOTEBUILDTOOL_PR_VOLUME}"

      - name: Prune old logs
        run: bash runner/logs.sh prune

  pr:
    name: PR
    needs: [plan, debug-build, debug-test, release-build, release-test]
    if: always()
    runs-on: [self-hosted, linux, x64, bitenovac]
    timeout-minutes: 1
    steps:
      - name: Check results
        run: |
          echo "plan:          ${{ needs.plan.result }}"
          echo "debug build:   ${{ needs.debug-build.result }}"
          echo "debug test:    ${{ needs.debug-test.result }}"
          echo "release build: ${{ needs.release-build.result }}"
          echo "release test:  ${{ needs.release-test.result }}"

          failed=0
          for result in "${{ needs.plan.result }}" "${{ needs.debug-build.result }}" "${{ needs.debug-test.result }}" "${{ needs.release-build.result }}" "${{ needs.release-test.result }}"; do
            case "${result}" in
              success) ;;
              *) failed=1 ;;
            esac
          done

          if [ "${failed}" -ne 0 ]; then
            echo "::error::At least one required job did not succeed."
            exit 1
          fi

          echo "All required jobs succeeded."
