name: PR

on:
  pull_request:
    branches: [master]

concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"
  REMOTEBUILDTOOL_PR_VOLUME: bitenovac-pr-${{ github.run_id }}
  REMOTEBUILDTOOL_LOG_RUN: PR_${{ github.event.pull_request.number }}/${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  plan:
    name: Plan
    runs-on: [self-hosted, linux, x64, bitenovac]
    timeout-minutes: 1
    steps:
      - uses: actions/checkout@v7

      - run: bash runner/in-container.sh plan

  debug:
    name: Debug
    needs: plan
    runs-on: [self-hosted, linux, x64, bitenovac]
    timeout-minutes: 1
    steps:
      - uses: actions/checkout@v7

      - id: build
        name: Build
        run: bash runner/in-container.sh build Debug

      - id: test
        name: Test + coverage gate
        run: bash runner/in-container.sh test Debug

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-Debug
          path: artifacts/coverage-report/Debug
          if-no-files-found: ignore

  release:
    name: Release
    needs: plan
    runs-on: [self-hosted, linux, x64, bitenovac]
    timeout-minutes: 1
    steps:
      - uses: actions/checkout@v7

      - name: Build
        run: bash runner/in-container.sh build Release

      - name: Test
        run: bash runner/in-container.sh test Release

  cleanup:
    name: Cleanup
    needs: [debug, release]
    if: always()
    runs-on: [self-hosted, linux, x64, bitenovac]
    timeout-minutes: 1
    steps:
      - uses: actions/checkout@v7

      - name: Drop this run's volumes
        run: docker volume rm -f "${REMOTEBUILDTOOL_PR_VOLUME}"

      - name: Prune old logs
        run: bash runner/logs.sh prune

  pr:
    name: PR
    needs: [plan, debug, release]
    if: always()
    runs-on: [self-hosted, linux, x64, bitenovac]
    timeout-minutes: 1
    steps:
      - name: Check results
        run: |
          echo "plan:    ${{ needs.plan.result }}"
          echo "debug:   ${{ needs.debug.result }}"
          echo "release: ${{ needs.release.result }}"

          failed=0
          for result in "${{ needs.plan.result }}" "${{ needs.debug.result }}" "${{ needs.release.result }}"; do
            case "${result}" in
              success) ;;
              *) failed=1 ;;
            esac
          done

          if [ "${failed}" -ne 0 ]; then
            echo "::error::At least one required job did not succeed."
            exit 1
          fi

          echo "All required jobs succeeded."
