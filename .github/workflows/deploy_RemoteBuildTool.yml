name: Deploy RemoteBuildTool

on:
  workflow_dispatch:
    inputs:
      drop:
        description: Official drop to deploy RemoteBuildTool from, for example 2026.10.11.001. Empty for the newest.
        required: false
        default: ''

concurrency:
  group: deploy_RemoteBuildTool
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    name: Deploy
    runs-on: [self-hosted, linux, x64, bitenovac]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Release the runner bundle
        env:
          DROP: ${{ inputs.drop }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [[ -n "${DROP}" ]]; then
            bash deploy/remotedeploytool.sh github-release --drop "${DROP}"
          else
            bash deploy/remotedeploytool.sh github-release
          fi
