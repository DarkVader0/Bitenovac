name: GitHub webhook on PR merge

on:
  pull_request:
    types: [closed]
    branches: [master]

permissions: {}

jobs:
  wake:
    name: Wake the RemoteBuildTool service
    if: github.event.pull_request.merged
    runs-on: [self-hosted, linux, x64, bitenovac]
    timeout-minutes: 1
    steps:
      - name: Promote the merge into main now
        run: docker exec remotebuildtool-service remotebuildtool wake
