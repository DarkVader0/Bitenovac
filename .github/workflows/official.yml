name: Official

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch: {}

concurrency:
  group: official
  cancel-in-progress: false

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"
  REMOTEBUILDTOOL_PR_VOLUME: bitenovac-pr-official-${{ github.run_id }}

jobs:
  release:
    name: Release
    runs-on: [self-hosted, linux, x64, bitenovac]
    timeout-minutes: 1
    steps:
      - uses: actions/checkout@v7

      - name: Plan
        run: bash runner/in-container.sh plan

      - name: Build and drop
        run: bash runner/in-container.sh release

      - name: Drop this run's volume
        if: always()
        run: docker volume rm -f "${REMOTEBUILDTOOL_PR_VOLUME}"
