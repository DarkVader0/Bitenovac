name: Official

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch: {}

concurrency:
  group: official
  cancel-in-progress: false

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"
  REMOTEBUILDTOOL_CACHELESS: "true"
  REMOTEBUILDTOOL_LOG_RUN: Official_${{ github.run_number }}/${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  release:
    name: Release
    runs-on: [self-hosted, linux, x64, bitenovac]
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v7

      - name: Plan
        run: bash runner/in-container.sh plan

      - name: Build and drop
        run: bash runner/in-container.sh release
