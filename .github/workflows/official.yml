name: Official

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch: {}

concurrency:
  group: official
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

env:
  DOTNET_NOLOGO: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"
  REMOTEBUILDTOOL_PR_VOLUME: bitenovac-pr-official-${{ github.run_id }}
  REMOTEBUILDTOOL_LOG_RUN: Official_pending_${{ github.run_number }}/${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  release:
    name: Release
    runs-on: [self-hosted, linux, x64, bitenovac]
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v7

      - name: Plan
        run: bash runner/in-container.sh plan

      - name: Build and drop
        run: bash runner/in-container.sh release

      - name: Fetch job timings
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifacts
          curl -fsS -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}/jobs?per_page=100" \
            -o artifacts/jobs.json || echo "Job timings unavailable; the build is reported without them."

      - name: Report build
        if: always()
        continue-on-error: true
        run: bash runner/in-container.sh report-build "${{ job.status }}" artifacts/jobs.json

      - name: Drop this run's volume
        if: always()
        run: docker volume rm -f "${REMOTEBUILDTOOL_PR_VOLUME}"

      - name: Name logs after the drop
        if: always()
        run: bash runner/logs.sh seal-official "${{ github.run_number }}"

      - name: Prune old logs
        if: always()
        run: bash runner/logs.sh prune
