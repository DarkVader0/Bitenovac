name: Telemetry compaction

on:
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch: {}

concurrency:
  group: telemetry-compaction
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  compact:
    name: Compact
    runs-on: [self-hosted, linux, x64, bitenovac]
    timeout-minutes: 1
    steps:
      - uses: actions/checkout@v7

      - name: Compact and rebuild telemetry.duckdb
        run: bash runner/telemetry.sh compact
