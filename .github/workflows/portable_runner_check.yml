name: Portable runner check

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  plan:
    name: Plan on the test runner
    runs-on: [self-hosted, linux, x64, bitenovac-test]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Plan
        run: bash runner/in-container.sh plan
