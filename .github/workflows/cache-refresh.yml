name: Cache refresh

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch: {}

concurrency:
  group: master
  cancel-in-progress: false

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"
  REMOTEBUILDTOOL_PR_VOLUME: bitenovac-pr-master-${{ github.run_id }}
  REMOTEBUILDTOOL_LOG_RUN: CacheRefresh_${{ github.run_number }}/${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  plan:
    name: Plan
    runs-on: [self-hosted, linux, x64, bitenovac]
    timeout-minutes: 1
    steps:
      - uses: actions/checkout@v7

      - run: bash runner/in-container.sh plan

  debug:
    name: Debug
    needs: plan
    runs-on: [self-hosted, linux, x64, bitenovac]
    timeout-minutes: 1
    steps:
      - uses: actions/checkout@v7

      - name: Build
        run: bash runner/in-container.sh build Debug

      - name: Test + coverage gate
        run: bash runner/in-container.sh test Debug

  release:
    name: Release
    needs: plan
    runs-on: [self-hosted, linux, x64, bitenovac]
    timeout-minutes: 1
    steps:
      - uses: actions/checkout@v7

      - name: Build
        run: bash runner/in-container.sh build Release

      - name: Test
        run: bash runner/in-container.sh test Release

  promote:
    name: Promote
    needs: [debug, release]
    runs-on: [self-hosted, linux, x64, bitenovac]
    timeout-minutes: 1
    steps:
      - uses: actions/checkout@v7

      - run: bash runner/in-container.sh promote

  cleanup:
    name: Cleanup
    needs: [promote]
    if: always()
    runs-on: [self-hosted, linux, x64, bitenovac]
    timeout-minutes: 1
    steps:
      - uses: actions/checkout@v7

      - name: Drop this run's volume
        run: docker volume rm -f "${REMOTEBUILDTOOL_PR_VOLUME}"

      - name: Prune old logs
        run: bash runner/logs.sh prune
