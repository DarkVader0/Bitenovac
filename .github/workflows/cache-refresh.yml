name: Cache refresh

on:
  push:
    branches: [master]
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch: {}

concurrency:
  group: master
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

env:
  DOTNET_NOLOGO: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"
  REMOTEBUILDTOOL_PR_VOLUME: bitenovac-pr-master-${{ github.run_id }}
  REMOTEBUILDTOOL_LOG_RUN: CacheRefresh_${{ github.run_number }}/${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  plan:
    name: Plan
    runs-on: [self-hosted, linux, x64, bitenovac]
    timeout-minutes: 1
    steps:
      - uses: actions/checkout@v7

      - run: bash runner/in-container.sh plan

  debug-build:
    name: Debug build
    needs: plan
    runs-on: [self-hosted, linux, x64, bitenovac]
    timeout-minutes: 1
    steps:
      - uses: actions/checkout@v7

      - name: Build
        run: bash runner/in-container.sh build Debug

  debug-test:
    name: Debug test
    needs: debug-build
    runs-on: [self-hosted, linux, x64, bitenovac]
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7

      - name: Test + coverage gate
        run: bash runner/in-container.sh test Debug

  release-build:
    name: Release build
    needs: plan
    runs-on: [self-hosted, linux, x64, bitenovac]
    timeout-minutes: 1
    steps:
      - uses: actions/checkout@v7

      - name: Build
        run: bash runner/in-container.sh build Release

  release-test:
    name: Release test
    needs: release-build
    runs-on: [self-hosted, linux, x64, bitenovac]
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7

      - name: Test
        run: bash runner/in-container.sh test Release

  promote:
    name: Promote
    needs: [debug-test, release-test]
    runs-on: [self-hosted, linux, x64, bitenovac]
    timeout-minutes: 1
    steps:
      - uses: actions/checkout@v7

      - run: bash runner/in-container.sh promote

  cleanup:
    name: Cleanup
    needs: [plan, debug-build, debug-test, release-build, release-test, promote]
    if: always()
    runs-on: [self-hosted, linux, x64, bitenovac]
    timeout-minutes: 1
    steps:
      - uses: actions/checkout@v7

      - name: Fetch job timings
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifacts
          curl -fsS -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}/jobs?per_page=100" \
            -o artifacts/jobs.json || echo "Job timings unavailable; the build is reported without them."

      - name: Report build
        continue-on-error: true
        run: bash runner/in-container.sh report-build "${{ (contains(needs.*.result, 'failure') && 'failure') || (contains(needs.*.result, 'cancelled') && 'cancelled') || 'success' }}" artifacts/jobs.json

      - name: Drop this run's volume
        run: docker volume rm -f "${REMOTEBUILDTOOL_PR_VOLUME}"

      - name: Prune old logs
        run: bash runner/logs.sh prune
