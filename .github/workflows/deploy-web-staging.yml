name: Deploy web to staging

on:
  workflow_dispatch:
    inputs:
      drop:
        description: Official drop to deploy to staging, for example 2026.10.11.001. Empty for the newest.
        required: false
        default: ''

concurrency:
  group: deploy-web-staging
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy
    runs-on: [self-hosted, linux, x64, bitenovac]
    timeout-minutes: 3
    environment: cloudflare-staging
    steps:
      - uses: actions/checkout@v7

      - name: Deploy to the staging project
        env:
          DROP: ${{ inputs.drop }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          REMOTEDEPLOYTOOL_STAGING_URL: ${{ vars.STAGING_URL }}
        run: |
          args=(auto)
          if [[ -n "${DROP}" ]]; then args+=("${DROP}"); fi
          bash deploy/remotedeploytool.sh "${args[@]}"
