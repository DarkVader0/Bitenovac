<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bitenovac</title>
    <meta name="description" content="Plans decompression dives for open circuit and rebreathers, offline." />
    <base href="/" />
    <script src="js/theme.js"></script>
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/svg+xml" href="icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon.png" />
    <link href="Bitenovac.DecompressionCalculator.Web.styles.css" rel="stylesheet" />
    <link href="manifest.webmanifest" rel="manifest" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Bitenovac" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#03173d" />
    <script type="module" src="js/pwa.js"></script>
</head>

<body>
    <div id="app"></div>

    <div id="loading" class="loading-screen">
        <div class="loading-dive" role="img" aria-label="Loading Bitenovac" style="opacity: 0; width: 128px; height: 128px">
            <svg class="loading-dive-ceiling" viewBox="0 0 512 512" width="128" height="128">
                <path d="M150 140 C 210 140 250 250 300 262 L 330 262 L 340 220 L 372 220 L 384 180 L 404 180 L 420 140 Z" fill="#e04848" fill-opacity="0.55" />
                <path d="M150 140 C 210 140 250 250 300 262 L 330 262 L 340 220 L 372 220 L 384 180 L 404 180 L 420 140" fill="none" stroke="#ff6b6b" stroke-width="12" stroke-linejoin="round" stroke-linecap="round" />
            </svg>
            <svg viewBox="0 0 512 512" width="128" height="128">
                <line x1="64" y1="140" x2="448" y2="140" stroke="#7cc4ff" stroke-width="14" stroke-linecap="round" />
                <polyline points="92,140 150,370 300,370 330,262 360,262 372,220 392,220 404,180 412,180 420,140" fill="none" stroke="currentColor" stroke-width="30" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
            <span class="loading-dive-cover"></span>
        </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="js/loading.js"></script>
    <script src="_framework/blazor.webassembly.js" autostart="false"></script>
    <script>
        // The language the diver chose is loaded before the app starts, so its resources are in place from the first render.
        (() => {
            const languages = ["en", "de"];
            let language = "en";
            try {
                const saved = JSON.parse(localStorage.getItem("bitenovac.preferences") ?? "null")?.language;
                if (languages.includes(saved)) {
                    language = saved;
                }
            } catch {
                language = "en";
            }

            document.documentElement.lang = language;
            Blazor.start({ applicationCulture: language });
        })();
    </script>
</body>

</html>
